name: Build and Test MangoGeneration (Rust + C)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Единая быстрая сборка компилируемых бинарников (Rust и C)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Устанавливаем тулчейн Rust
      - name: Setup Rust Toolchain (1.97.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: |
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-gnu

      # 2. Ставим компиляторы GCC: родной для Linux и кросс-компилятор для Windows (.exe)
      - name: Install Compilers (GCC & MinGW)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-mingw-w64-x86-64 make

      # 3. Собираем Си-мозг (brain) локально под Linux перед сборкой Rust
      - name: Build C Brain for Linux (x86_64)
        run: |
          if [ -f Makefile ]; then
            make
          else
            gcc -Wall -Wextra -O2 -I. -Ivendor brain.c -o brain_bin -lm
          fi

      # 4. Компилируем основной Rust-проект под Linux
      - name: Build Rust Engine for Linux (x86_64)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      # 5. Компилируем основной Rust-проект под Windows (.exe)
      - name: Build Rust Engine for Windows (x86_64)
        run: cargo build --release --target x86_64-pc-windows-gnu

      # 6. Собираем и сохраняем готовые артефакты (бинарники Linux и исполняемые файлы Windows)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mangogeneration-binaries
          path: |
            brain_bin
            target/x86_64-unknown-linux-gnu/release/mangogeneration
            target/x86_64-pc-windows-gnu/release/*.exe
          if-no-files-found: warn
